# Thraasu's alert mailer. No public URL: only the Pages Function reaches it, through the
# service binding MAILER in the root wrangler.toml. Deploy from this folder: npx wrangler@4 deploy
name = "thraasu-mail"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

# Email Routing on tinkerhouse.uk; the binding can only deliver to this verified address.
[[send_email]]
name = "MAIL"
destination_address = "ckventurestech@gmail.com"
