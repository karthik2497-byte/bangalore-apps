name: Build Android AABs

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - 1_power_pulse
          - 2_meter_smart
          - 3_pg_buddy
          - 4_nest_hub
          - 5_lingo_local
          - 6_stock_ping
          - 7_card_guard
          - 8_thraasu
      origin:
        description: 'Origin the TWAs load from (must match the deployed site and its /.well-known/assetlinks.json)'
        required: true
        default: 'https://tinkerhouse.uk'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.app }}" = "all" ]; then
            echo 'matrix={"include":[{"name":"PowerPulse","dir":"1_power_pulse","pkg":"uk.tinkerhouse.powerpulse"},{"name":"MeterSmart","dir":"2_meter_smart","pkg":"uk.tinkerhouse.metersmart"},{"name":"PGBuddy","dir":"3_pg_buddy","pkg":"uk.tinkerhouse.pgbuddy"},{"name":"NestHub","dir":"4_nest_hub","pkg":"uk.tinkerhouse.nesthub"},{"name":"LingoLocal","dir":"5_lingo_local","pkg":"uk.tinkerhouse.lingolocal"},{"name":"StockPing","dir":"6_stock_ping","pkg":"uk.tinkerhouse.stockping"},{"name":"CardGuard","dir":"7_card_guard","pkg":"uk.tinkerhouse.cardguard"},{"name":"Thraasu","dir":"8_thraasu","pkg":"uk.tinkerhouse.thraasu"}]}' >> "$GITHUB_OUTPUT"
          else
            DIR="${{ github.event.inputs.app }}"
            NAME=$(echo "$DIR" | sed 's/^[0-9]*_//' | sed 's/_/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1' | tr -d ' ')
            PKG="uk.tinkerhouse.$(echo "$DIR" | sed 's/^[0-9]*_//' | tr -d '_')"
            echo "matrix={\"include\":[{\"name\":\"$NAME\",\"dir\":\"$DIR\",\"pkg\":\"$PKG\"}]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Its default also asks for the old 'tools' package, which sdkmanager no longer finds (exit 1, 2026-10-29).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Pinned: 1.27.0's template targets API 36, which Play requires of new apps and updates since 2026-08-31.
      - name: Install Bubblewrap Core
        run: cd scripts && npm init -y && npm install @bubblewrap/core@1.27.0

      - name: Write Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # The one upload key for every app (made 2026-10-29; the original is in ~/play-upload-key on Karthik's Mac).
      # Play re-signs each app with its own app signing key, which is what assetlinks.json must name.
      - name: Restore the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ] || { echo "secrets UPLOAD_KEYSTORE_BASE64 / UPLOAD_KEYSTORE_PASSWORD missing"; exit 1; }
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass:env KS_PASS -alias upload | grep 'SHA256:'

      - name: Generate TWA project (non-interactive)
        run: |
          ORIGIN="${{ github.event.inputs.origin }}"
          MANIFEST_URL="${ORIGIN%/}/${{ matrix.dir }}/manifest.json"
          BUILD_DIR="build_${{ matrix.dir }}"

          # Fail here rather than shipping an AAB whose TWA never verifies: the
          # origin has to actually serve this app, and its assetlinks must name
          # this exact package.
          curl -fsS "$MANIFEST_URL" > /dev/null
          curl -fsS "${ORIGIN%/}/.well-known/assetlinks.json" | grep -q '${{ matrix.pkg }}'

          # Use @bubblewrap/core directly to avoid interactive CLI prompts.
          node scripts/generate-twa.mjs \
            "$MANIFEST_URL" \
            "$BUILD_DIR" \
            "$RUNNER_TEMP/upload.keystore" \
            "${{ matrix.pkg }}"

          echo "=== Generated files ==="
          ls -la "$BUILD_DIR/"
          echo "=== twa-manifest.json ==="
          cat "$BUILD_DIR/twa-manifest.json"

      - name: Build APK and AAB with Gradle
        working-directory: build_${{ matrix.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign APK
        working-directory: build_${{ matrix.dir }}
        env:
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app-release-aligned.apk"
          SIGNED_APK="app-release-signed.apk"

          # Zipalign
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)/zipalign" \
            -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Sign with apksigner
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)/apksigner" sign \
            --ks "$RUNNER_TEMP/upload.keystore" \
            --ks-key-alias upload \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "Signed APK: $SIGNED_APK"
          ls -la "$SIGNED_APK"

      - name: Sign AAB
        working-directory: build_${{ matrix.dir }}
        env:
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          UNSIGNED_AAB="app/build/outputs/bundle/release/app-release.aab"
          SIGNED_AAB="app-release-bundle.aab"

          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass:env KS_PASS \
            "$UNSIGNED_AAB" upload

          # Copy signed AAB to expected output name
          cp "$UNSIGNED_AAB" "$SIGNED_AAB"

          echo "Signed AAB: $SIGNED_AAB"
          ls -la "$SIGNED_AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-aab
          path: build_${{ matrix.dir }}/app-release-bundle.aab
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-apk
          path: build_${{ matrix.dir }}/app-release-signed.apk
          if-no-files-found: warn
