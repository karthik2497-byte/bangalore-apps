<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Tinkerhouse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0F172A; --surface:#1E293B; --border:#334155; --text:#F8FAFC; --accent:#818CF8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1E1B4B 0%,#0F172A 50%,#164E63 100%);
    color:var(--text); text-align:center;
  }
  .code { font-size:clamp(64px,18vw,120px); font-weight:800; line-height:1;
          background:linear-gradient(135deg,#E0E7FF,#818CF8);
          -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  h1 { font-size:clamp(20px,5vw,28px); font-weight:600; margin:16px 0 8px; }
  p { color:#94A3B8; max-width:38ch; margin:0 auto 28px; line-height:1.6; }
  a { display:inline-block; padding:12px 24px; border:1px solid var(--border);
      border-radius:10px; background:rgba(255,255,255,0.06); color:var(--accent);
      text-decoration:none; font-weight:600; }
  a:hover { background:rgba(129,140,248,0.15); }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That address doesn't exist here. It may have moved, or the link that sent you was wrong.</p>
    <a href="/">Back to all apps</a>
  </main>
</body>
</html>
